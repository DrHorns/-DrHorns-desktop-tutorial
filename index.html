<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DrHorns Todo App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>DrHorns Todo</h1>
      <button id="theme-toggle" title="Toggle theme">&#9790;</button>
    </div>
    <form id="todo-form">
      <div class="form-row">
        <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off" required>
        <input type="date" id="todo-date" title="Due date (optional)">
        <button type="submit">Add</button>
      </div>
    </form>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="done">Done</button>
      <span id="task-count"></span>
      <button id="clear-done" class="filter-btn" style="display:none;">Clear done</button>
    </div>
    <ul id="todo-list"></ul>
    <p id="empty-msg">No tasks yet. Add one above!</p>
  </div>
  <script src="app.js"></script>
</body>
</html>
